<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ewidencja godzin</title>
<meta name="description" content="Wpisz liczbę godzin w miesiącu, a narzędzie przygotuje ewidencję czasu do wydruku.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F1F2F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131629" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%239E2A5E'/%3E%3Crect x='13' y='5' width='6' height='22' rx='3' fill='%23fff' opacity='.35'/%3E%3Crect x='13' y='10' width='6' height='11' rx='3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Tinos:ital,wght@0,400;1,700&display=swap" rel="stylesheet">
<style>
:root {
  --papier: #F1F2F5;
  --karta: #FFFFFF;
  --atrament: #1E2443;
  --szary: #646A84;
  --linia: #D6D9E3;
  --akcent: #9E2A5E;
  --blad: #B3261E;
  --cien: 0 1px 2px rgba(30, 36, 67, .06), 0 8px 24px rgba(30, 36, 67, .06);
  --cien-kartki: 0 1px 3px rgba(30, 36, 67, .12), 0 12px 32px rgba(30, 36, 67, .10);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #131629; --karta: #1C2038; --atrament: #E9EAF2; --szary: #9DA1B8;
    --linia: #2F3452; --akcent: #E7709F; --blad: #FF8A80; --cien: none;
    --cien-kartki: 0 0 0 1px #2F3452; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papier: #131629; --karta: #1C2038; --atrament: #E9EAF2; --szary: #9DA1B8;
  --linia: #2F3452; --akcent: #E7709F; --blad: #FF8A80; --cien: none;
  --cien-kartki: 0 0 0 1px #2F3452; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--papier);
  color: var(--atrament);
  font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
main {
  max-width: 720px;
  margin: 0 auto;
  padding: max(28px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom));
}

h1 {
  font-size: clamp(2.25rem, 9vw, 3.5rem);
  font-variation-settings: "opsz" 96;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -.03em;
  margin: 0 0 .5rem;
}
.wstep { margin: 0 0 1.75rem; color: var(--szary); max-width: 46ch; }

.karta {
  background: var(--karta);
  border: 1px solid var(--linia);
  border-radius: 18px;
  box-shadow: var(--cien);
  padding: 20px;
}

/* Formularz */
.pola { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
.pole { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pole.szerokie { grid-column: 1 / -1; }
label { font-size: .875rem; font-weight: 600; }
input, select {
  font: inherit;
  font-size: 16px; /* mniej nie wolno: iOS powiększa stronę przy wpisywaniu */
  color: var(--atrament);
  background: var(--papier);
  border: 1px solid var(--linia);
  border-radius: 10px;
  padding: 11px 12px;
  width: 100%;
  min-height: 46px;
}
input:focus-visible, select:focus-visible, button:focus-visible {
  outline: 3px solid var(--akcent);
  outline-offset: 2px;
}
input[aria-invalid="true"] { border-color: var(--blad); }

/* Lista osób */
.osoby { grid-column: 1 / -1; border: 0; margin: 0; padding: 0; min-width: 0; }
.osoby legend { font-size: .875rem; font-weight: 600; padding: 0; margin-bottom: 8px; }
.naglowki, .osoba-wiersz {
  display: grid;
  grid-template-columns: 1.75rem minmax(0, 1fr) 6.5rem;
  gap: 8px;
  align-items: center;
}
.naglowki { font-size: .8125rem; color: var(--szary); margin-bottom: 6px; }
.naglowki span:first-child { visibility: hidden; }
.lista { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.nr { font-size: .9375rem; color: var(--szary); text-align: right; font-variant-numeric: tabular-nums; }
.osoba-wiersz .godz { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.osoba-wiersz .komunikat { grid-column: 2 / -1; font-size: .875rem; }
.ogolny { margin-top: 10px; }
.podpowiedz { font-size: .875rem; color: var(--szary); margin: 0; }
.komunikat { font-size: .9375rem; color: var(--blad); margin: 0; font-weight: 600; }
.komunikat:empty { display: none; }

/* Opcje (pola wyboru) */
.opcje { grid-column: 1 / -1; border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.opcje legend { font-size: .875rem; font-weight: 600; padding: 0; margin-bottom: 6px; }
.opcja {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 46px;
  padding: 8px 12px;
  background: var(--papier);
  border: 1px solid var(--linia);
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.opcja input {
  appearance: auto;
  width: 22px;
  height: 22px;
  min-height: 0;
  margin: 0;
  padding: 0;
  flex: none;
  accent-color: var(--akcent);
  cursor: pointer;
}
.opcja:has(input:checked) { border-color: var(--akcent); }
.opcja:has(input:focus-visible) { outline: 3px solid var(--akcent); outline-offset: 2px; }
.opcja input:focus-visible { outline: none; }

button {
  font: inherit;
  font-weight: 600;
  border-radius: 12px;
  min-height: 48px;
  padding: 0 20px;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  transition: transform 160ms var(--ease-out), background-color 150ms ease;
}
button:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) {
  .glowny:hover { background: color-mix(in srgb, var(--akcent) 88%, var(--atrament)); }
  .drugi:hover { background: var(--karta); }
}
.glowny {
  grid-column: 1 / -1;
  background: var(--akcent);
  color: #fff;
  border: 0;
  font-size: 1.0625rem;
  margin-top: 4px;
}
:root[data-theme="dark"] .glowny { color: #1C0F16; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .glowny { color: #1C0F16; } }
.drugi {
  background: transparent;
  color: var(--atrament);
  border: 1px solid var(--linia);
}

#wynik { margin-top: 2rem; }
#wynik[hidden] { display: none; }
.akcje { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 1rem; }
.akcje button { flex: 1 1 160px; }

/* Dokument A4 — układ odmierzony ze wzoru (Arkusz1.pdf). 1cqw = 2,1 mm na wydruku. */
.ramka { container-type: inline-size; }
.ramka { display: flex; flex-direction: column; gap: 24px; }
.arkusz {
  aspect-ratio: 210 / 297;
  background: #fff;
  color: #000;
  box-shadow: var(--cien-kartki);
  border-radius: 3px;
  padding: 8cqw 6.5cqw 0;
  font-family: "Tinos", "Times New Roman", Times, serif;
  overflow: hidden;
}
.arkusz table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  --kreska: max(1px, .09cqw) solid #000;
}
.arkusz th, .arkusz td { border: var(--kreska); padding: 0; }
.arkusz .tytul {
  height: 7cqw;
  vertical-align: bottom;
  padding-bottom: .8cqw;
  text-align: center;
  font-size: 1.95cqw;
  font-style: italic;
  font-weight: 700;
}
.arkusz .osoba .nazwisko { font-style: normal; font-weight: 400; margin-left: .6cqw; }
.arkusz .osoba {
  height: 4.3cqw;
  vertical-align: bottom;
  padding: 0 0 .25cqw .2cqw;
  text-align: left;
  font-size: 1.65cqw;
  font-style: italic;
  font-weight: 700;
}
.arkusz .kolumny th {
  height: 5.7cqw;
  font-size: 1.6cqw;
  font-style: italic;
  font-weight: 700;
  line-height: 1.15;
  text-align: center;
  vertical-align: middle;
}
.arkusz tbody td {
  height: 3.43cqw;
  font-size: 1.75cqw;
  text-align: center;
  vertical-align: middle;
  font-variant-numeric: tabular-nums;
}
.arkusz tbody td.suma { font-weight: 700; }

@media (max-width: 380px) {
  .karta { padding: 16px; }
}

@media print {
  @page { size: A4; margin: 0; } /* margines 0 wyłącza nagłówek i stopkę przeglądarki */
  html, body { background: #fff; }
  main { max-width: none; padding: 0; margin: 0; }
  h1, .wstep, form, .akcje { display: none !important; }
  #wynik { margin: 0; }
  .ramka { width: 210mm; display: block; }
  .arkusz {
    width: 210mm;
    height: 296mm; /* milimetr zapasu, żeby nie powstała pusta druga strona */
    aspect-ratio: auto;
    box-shadow: none;
    border-radius: 0;
    break-inside: avoid;
  }
  .arkusz + .arkusz { break-before: page; } /* każda osoba na osobnej kartce */
}
</style>
</head>
<body>
<main>
  <h1>Ewidencja godzin</h1>
  <p class="wstep">Wpisz osoby i to, ile godzin każda ma w miesiącu. Dla każdej przygotuję osobną ewidencję czasu do wydruku: godziny rozłożę na dni od poniedziałku do soboty, między 8:00 a 22:00, z pominięciem niedziel i świąt.</p>

  <form id="formularz" class="karta" novalidate>
    <div class="pola">
      <div class="pole">
        <label for="miesiac">Miesiąc</label>
        <select id="miesiac"></select>
      </div>
      <div class="pole">
        <label for="rok">Rok</label>
        <select id="rok"></select>
      </div>
      <p id="podpowiedz" class="podpowiedz pole szerokie"></p>
      <fieldset class="opcje">
        <legend>Opcje (dla wszystkich osób)</legend>
        <label class="opcja"><input type="checkbox" id="maks10h"> Maksymalnie 10 h w dniu</label>
        <label class="opcja"><input type="checkbox" id="bezPolowek"> Bez połówek (tylko pełne godziny)</label>
      </fieldset>
      <fieldset class="osoby">
        <legend>Osoby</legend>
        <div class="naglowki" aria-hidden="true"><span>Nr</span><span>Imię i nazwisko</span><span>Godziny</span></div>
        <ol id="lista" class="lista"></ol>
        <p id="komunikat" class="komunikat ogolny" role="alert"></p>
      </fieldset>
      <button type="submit" class="glowny">Utwórz ewidencje</button>
    </div>
  </form>

  <section id="wynik" hidden aria-label="Ewidencje do wydruku">
    <div class="akcje">
      <button type="button" class="drugi" id="drukuj">Drukuj / PDF</button>
      <button type="button" class="drugi" id="ponownie">Losuj ponownie</button>
    </div>
    <div class="ramka" id="arkusze"></div>
  </section>
</main>

<template id="wzor">
  <div class="arkusz">
    <table>
      <colgroup>
        <col style="width:12%"><col style="width:14.7%"><col style="width:13.9%">
        <col style="width:22.5%"><col style="width:18.6%"><col style="width:18.3%">
      </colgroup>
      <thead>
        <tr><th colspan="6" class="tytul">EWIDENCJA CZASU ZLECENIOBIORCY</th></tr>
        <tr><th colspan="6" class="osoba">IMIĘ I NAZWISKO ZLECENIOBIORCY:<span class="nazwisko"></span></th></tr>
        <tr class="kolumny">
          <th>DATA</th><th>OD GODZINY</th><th>DO GODZINY</th>
          <th>ILOŚĆ GODZIN<br>PRZEPRACOWANYCH</th><th>PODPIS<br>ZLECENIOBIORCY</th><th>PODPIS<br>ZLECENIODAWCY</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</template>

<!-- Przy każdej zmianie logika.js podbij ?v=, inaczej przeglądarka (pamięć 10 min) poda starą wersję. -->
<script src="logika.js?v=4"></script>
<script>
(function () {
  'use strict';
  var R = window.Rozklad;
  var $ = function (id) { return document.getElementById(id); };
  if (!R) {
    $('komunikat').textContent = 'Strona nie wczytała się do końca. Odśwież ją i spróbuj jeszcze raz.';
    $('formularz').addEventListener('submit', function (e) { e.preventDefault(); });
    return;
  }
  var OSOB = 11;
  var WIERSZY = 31; // tyle wierszy ma wzór, niezależnie od liczby dni pracy
  var PAMIEC = 'ewidencja-osoby-v1';
  var ostatni = null;

  function wielka(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function dniSlowo(n) { return n === 1 ? 'dzień' : 'dni'; }
  function dwie(n) { return (n < 10 ? '0' : '') + n; }

  // Wybór miesiąca i roku
  var teraz = new Date();
  R.MIESIACE.forEach(function (m, i) {
    var o = document.createElement('option');
    o.value = i + 1; o.textContent = wielka(m);
    $('miesiac').appendChild(o);
  });
  for (var r = teraz.getFullYear() - 1; r <= teraz.getFullYear() + 1; r++) {
    var o = document.createElement('option');
    o.value = r; o.textContent = r;
    $('rok').appendChild(o);
  }
  $('miesiac').value = teraz.getMonth() + 1;
  $('rok').value = teraz.getFullYear();

  // Wiersze osób: imię i nazwisko + godziny
  var osoby = [];
  for (var n = 0; n < OSOB; n++) {
    var li = document.createElement('li');
    li.className = 'osoba-wiersz';
    var nr = document.createElement('span');
    nr.className = 'nr'; nr.textContent = (n + 1) + '.'; nr.setAttribute('aria-hidden', 'true');
    var imie = document.createElement('input');
    imie.type = 'text'; imie.autocomplete = 'off'; imie.id = 'imie' + n;
    imie.setAttribute('aria-label', 'Osoba ' + (n + 1) + ': imię i nazwisko');
    imie.placeholder = n === 0 ? 'np. Jan Kowalski' : '';
    var godz = document.createElement('input');
    godz.type = 'text'; godz.inputMode = 'decimal'; godz.autocomplete = 'off'; godz.className = 'godz';
    godz.setAttribute('aria-label', 'Osoba ' + (n + 1) + ': liczba godzin');
    godz.placeholder = n === 0 ? 'np. 87' : '';
    var kom = document.createElement('p');
    kom.className = 'komunikat'; kom.id = 'kom' + n;
    godz.setAttribute('aria-describedby', kom.id);
    imie.setAttribute('aria-describedby', kom.id);
    li.appendChild(nr); li.appendChild(imie); li.appendChild(godz); li.appendChild(kom);
    $('lista').appendChild(li);
    osoby.push({ imie: imie, godz: godz, kom: kom });
  }

  // Imiona, nazwiska i opcje zostają w tej przeglądarce na następny miesiąc (godziny nie).
  function zapamietaj() {
    try {
      localStorage.setItem(PAMIEC, JSON.stringify({
        imiona: osoby.map(function (o) { return o.imie.value; }),
        maks10h: $('maks10h').checked, bezPolowek: $('bezPolowek').checked
      }));
    } catch (e) { /* bez pamięci też działa */ }
  }
  try {
    var zap = JSON.parse(localStorage.getItem(PAMIEC) || 'null');
    if (zap) {
      (zap.imiona || []).forEach(function (v, i) { if (osoby[i]) osoby[i].imie.value = v || ''; });
      $('maks10h').checked = !!zap.maks10h;
      $('bezPolowek').checked = !!zap.bezPolowek;
    }
  } catch (e) { /* brak dostępu do pamięci */ }

  function wybrany() {
    return {
      rok: +$('rok').value, mc: +$('miesiac').value,
      opcje: { maks10h: $('maks10h').checked, bezPolowek: $('bezPolowek').checked }
    };
  }

  function podpowiedz() {
    var w = wybrany(), n = R.dniPracy(w.rok, w.mc).length;
    $('podpowiedz').textContent = wielka(R.MIESIACE[w.mc - 1]) + ' ' + w.rok + ': ' + n + ' ' + dniSlowo(n) +
      ' pracy, czyli od 4 do ' + R.formatGodzin(R.maksMiesiac(w.rok, w.mc, w.opcje)) + ' godzin' +
      (w.opcje.bezPolowek ? ' (pełnych)' : '') + ' na osobę.';
  }
  $('miesiac').addEventListener('change', podpowiedz);
  $('rok').addEventListener('change', podpowiedz);
  $('maks10h').addEventListener('change', function () { podpowiedz(); zapamietaj(); });
  $('bezPolowek').addEventListener('change', function () { podpowiedz(); zapamietaj(); });
  osoby.forEach(function (o) { o.imie.addEventListener('change', zapamietaj); });
  window.addEventListener('pageshow', podpowiedz);
  podpowiedz();

  function wyczyscBledy() {
    $('komunikat').textContent = '';
    osoby.forEach(function (o) {
      o.kom.textContent = '';
      o.imie.removeAttribute('aria-invalid');
      o.godz.removeAttribute('aria-invalid');
    });
  }

  function pokazBlad(tekst) {
    $('komunikat').textContent = tekst;
    $('wynik').hidden = true;
  }

  function licz() {
    podpowiedz();
    wyczyscBledy();
    var w = wybrany(), lista = [], pierwszyZly = null;
    osoby.forEach(function (o) {
      var imie = o.imie.value.trim(), godz = o.godz.value.trim();
      if (!imie && !godz) return; // pusty wiersz pomijamy
      var blad = null, pole = o.godz, wynik = null;
      if (!godz) blad = 'Wpisz liczbę godzin dla tej osoby.';
      else {
        wynik = R.rozdziel(w.rok, w.mc, godz, w.opcje);
        if (wynik.blad) blad = wynik.blad;
      }
      if (blad) {
        o.kom.textContent = blad;
        pole.setAttribute('aria-invalid', 'true');
        if (!pierwszyZly) pierwszyZly = pole;
        return;
      }
      lista.push({ imie: imie, wynik: wynik });
    });
    if (pierwszyZly) { pokazBlad('Popraw zaznaczone wiersze.'); pierwszyZly.focus(); return; }
    if (!lista.length) { pokazBlad('Wpisz godziny przynajmniej dla jednej osoby.'); osoby[0].imie.focus(); return; }
    zapamietaj();
    ostatni = { rok: w.rok, mc: w.mc, opcje: w.opcje, lista: lista };
    pokaz();
  }

  function komorka(tr, tekst) {
    var td = document.createElement('td');
    td.textContent = tekst || '';
    tr.appendChild(td);
  }

  function arkusz(o, osoba) {
    var a = $('wzor').content.firstElementChild.cloneNode(true);
    a.querySelector('.nazwisko').textContent = osoba.imie;
    a.setAttribute('aria-label', 'Ewidencja: ' + (osoba.imie || 'bez nazwiska'));
    var tb = a.querySelector('tbody'), wpisy = osoba.wynik.wpisy;
    var wierszSumy = wpisy.length + 1; // jeden pusty wiersz odstępu pod ostatnim dniem
    for (var i = 0; i < WIERSZY; i++) {
      var x = wpisy[i], tr = document.createElement('tr');
      komorka(tr, x && dwie(x.dzien) + '.' + dwie(o.mc) + '.' + o.rok);
      komorka(tr, x && R.formatCzasu(x.start));
      komorka(tr, x && R.formatCzasu(x.koniec));
      // Suma liczona z wierszy, nie przepisana z pola, więc sama sprawdza wynik.
      komorka(tr, x ? R.formatGodzin(x.koniec - x.start) : i === wierszSumy ? R.formatGodzin(R.sumaWpisow(wpisy)) : '');
      if (i === wierszSumy) tr.lastChild.className = 'suma';
      komorka(tr, ''); // podpis zleceniobiorcy
      komorka(tr, ''); // podpis zleceniodawcy
      tb.appendChild(tr);
    }
    return a;
  }

  function pokaz(ponowne) {
    var o = ostatni, cel = $('arkusze');
    cel.innerHTML = '';
    o.lista.forEach(function (osoba) { cel.appendChild(arkusz(o, osoba)); });
    if (ponowne && cel.animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      cel.animate([{ opacity: 0.4, filter: 'blur(1.5px)' }, { opacity: 1, filter: 'blur(0)' }],
        { duration: 200, easing: 'cubic-bezier(.23, 1, .32, 1)' });
    }
    $('drukuj').textContent = o.lista.length > 1 ? 'Drukuj / PDF (' + o.lista.length + ')' : 'Drukuj / PDF';

    var sekcja = $('wynik');
    var bylUkryty = sekcja.hidden;
    sekcja.hidden = false;
    if (bylUkryty) sekcja.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  }

  function drukuj() {
    var tytul = document.title;
    var jedna = ostatni.lista.length === 1 && ostatni.lista[0].imie;
    document.title = 'Ewidencja ' + ostatni.rok + '-' + dwie(ostatni.mc) + (jedna ? ' ' + jedna : ''); // nazwa pliku PDF
    window.print();
    setTimeout(function () { document.title = tytul; }, 500);
  }

  // Błąd nigdy nie może zostać cichy: zamiast „nic się nie dzieje” pokaż, co zrobić.
  function bezpiecznie(f) {
    return function () {
      try { f.apply(this, arguments); } catch (err) {
        pokazBlad('Coś poszło nie tak. Odśwież stronę i spróbuj jeszcze raz.');
        if (window.console) console.error(err);
      }
    };
  }

  $('formularz').addEventListener('submit', function (e) { e.preventDefault(); bezpiecznie(licz)(); });
  $('ponownie').addEventListener('click', bezpiecznie(function () {
    if (!ostatni) return;
    ostatni.lista.forEach(function (osoba) {
      var nowy = R.rozdziel(ostatni.rok, ostatni.mc, osoba.wynik.suma / 2, ostatni.opcje);
      if (!nowy.blad) osoba.wynik = nowy;
    });
    pokaz(true);
  }));
  $('drukuj').addEventListener('click', drukuj);
})();
</script>
</body>
